[package]
name = "space-impact"
version = "0.1.0"
edition = "2021"
description = "Nokia's Space Impact, rebuilt in Rust + Leptos + WebAssembly"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "space-impact"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "GainNode",
  "HtmlCanvasElement",
  "HtmlDivElement",
  "ImageData",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "OscillatorNode",
  "OscillatorType",
  "PointerEvent",
  "Storage",
  "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
